*,*::before,*::after{box-sizing:border-box}
body{margin:0}
/* Layout: tam ekran film sahneleri birbirine akar; üstte koyu perde, ortada logo + başlık, altta ince şeffaf düğmeler */
:root{
  --night:#0b0a09;
  --cream:#f3ead8;
  --cream-soft:rgba(243,234,216,.72);
  --line:rgba(243,234,216,.32);
  --line-hover:rgba(243,234,216,.75);
  --glass:rgba(243,234,216,.04);
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body:"Jost", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--body);font-weight:300;overflow-x:hidden}

.stage{position:fixed;inset:0;overflow:hidden;z-index:0}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.slide.on{opacity:1}
.slide .blur{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(28px) brightness(.55);transform:scale(1.1)}
.slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 45%, rgba(11,10,9,.15) 0%, rgba(11,10,9,.55) 70%, rgba(11,10,9,.8) 100%),
    linear-gradient(to bottom, rgba(11,10,9,.35), rgba(11,10,9,0) 30%, rgba(11,10,9,0) 55%, rgba(11,10,9,.75));}

.wrap{position:relative;z-index:2;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:40px;padding-inline:16px;padding-block:40px 34px;text-align:center}

/* Logo yeri: logonuz gelince bu SVG yerine <img src="logo.png"> konacak */
.mark{display:block;height:clamp(110px,18vh,170px);width:auto;max-width:100%;filter:drop-shadow(0 4px 18px rgba(0,0,0,.45))}

.title{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:auto}
.eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--cream-soft)}
h1{font-family:var(--display);font-weight:300;font-size:clamp(46px,9vw,104px);line-height:.95;margin:0;letter-spacing:.01em;text-wrap:balance;text-shadow:0 2px 30px rgba(0,0,0,.45)}
h1 em{font-style:italic}
.lead{margin:0;font-family:var(--display);font-style:italic;font-size:clamp(17px,2.2vw,22px);color:var(--cream-soft)}

nav{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 12px;max-width:900px;margin-top:auto}
nav a{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;color:var(--cream-soft);border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:10px 18px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:color .35s, border-color .35s, background .35s}
nav a:hover{color:var(--cream);border-color:var(--line-hover);background:rgba(243,234,216,.1)}
nav a:focus-visible{outline:1px solid var(--cream);outline-offset:3px}

.credit{position:fixed;left:18px;bottom:14px;z-index:2;display:flex;flex-direction:column;gap:2px;text-align:left;transition:opacity .8s ease}
.credit.fade{opacity:0}
.credit-title{font-family:var(--display);font-style:italic;font-size:16px;color:rgba(243,234,216,.7)}
.credit-sub{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(243,234,216,.45)}

@media (max-width:520px){nav a{padding:9px 14px;font-size:10.5px;letter-spacing:.16em}.credit{display:none}}
</style>

</div>

<script>
(() => {
  const slides = [...document.querySelectorAll('.slide')];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let i = 0, z = 1, switching = false;

  function fit(s){
    const v = s.querySelector('video');
    if (!v.videoWidth) return;
    const va = v.videoWidth / v.videoHeight, sa = innerWidth / innerHeight;
    // Ekranla aynı yönde ise tam ekran; dikey video yatay ekranda (veya tersi) ise ortada, arkası bulanık
    v.style.objectFit = Math.abs(Math.log(va / sa)) < 0.5 ? 'cover' : 'contain';
  }
  const credit = document.getElementById('credit'), cT = document.getElementById('creditTitle'), cS = document.getElementById('creditSub');
  const CREDITS = {
    veda:  ["Veda'ya ithafen", "Ayşe Kulin · A Level romanımız"],
    gazoz: ["İftarlık Gazoz'a ithafen", "Yüksel Aksu · A Level filmimiz"]
  };
  let curSet = 'veda';
  function setCredit(set){
    if (set === curSet || !CREDITS[set]) return;
    curSet = set; credit.classList.add('fade');
    setTimeout(() => { cT.textContent = CREDITS[set][0]; cS.textContent = CREDITS[set][1]; credit.classList.remove('fade'); }, 800);
  }
  function show(n){
    const s = slides[n], v = s.querySelector('video');
    setCredit(s.dataset.set);
    s.style.zIndex = ++z;
    try { v.currentTime = 0; } catch (e) {}
    const p = v.play(); if (p) p.catch(() => {});
    s.classList.add('on');
  }
  function next(){
    switching = true;
    const prev = slides[i];
    i = (i + 1) % slides.length;
    show(i);
    setTimeout(() => { prev.classList.remove('on'); prev.querySelector('video').pause(); switching = false; }, 1500);
  }
  slides.forEach(s => {
    const v = s.querySelector('video');
    v.addEventListener('loadedmetadata', () => fit(s));
    v.addEventListener('timeupdate', () => {
      if (!reduce && s === slides[i] && !switching && v.duration && v.currentTime > v.duration - 1.4) next();
    });
    v.addEventListener('ended', () => { if (!reduce && s === slides[i] && !switching) next(); });
  });
  addEventListener('resize', () => slides.forEach(fit));

  slides[0].style.zIndex = ++z;
  slides[0].classList.add('on');
  if (!reduce) { const p = slides[0].querySelector('video').play(); if (p) p.catch(() => {}); }
})();
</script>
